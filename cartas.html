<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria - Parejas Espaciales</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-back: #1e293b;
            --card-border: #3b82f6;
            --accent-glow: #60a5fa;
            --success-color: #10b981;
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.3);
        }

        .back-link {
            color: #60a5fa;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .back-link:hover { text-decoration: underline; }

        /* Panel de Estadísticas y Controles */
        .controls-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            padding: 15px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 90px;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #f1f5f9;
        }

        .difficulty-select {
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 10px;
            outline: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .difficulty-select:hover {
            border-color: var(--accent-glow);
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.3);
        }

        .btn-reset {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .btn-reset:active {
            transform: translateY(0);
        }

        /* Tablero de Cartas */
        .game-board {
            display: grid;
            gap: 15px;
            perspective: 1000px;
            max-width: 900px;
            width: 100%;
            justify-content: center;
        }

        .grid-easy { grid-template-columns: repeat(4, 1fr); }
        .grid-medium { grid-template-columns: repeat(4, 1fr); }
        .grid-hard { grid-template-columns: repeat(6, 1fr); }

        @media (max-width: 600px) {
            .grid-medium { grid-template-columns: repeat(4, 1fr); }
            .grid-hard { grid-template-columns: repeat(4, 1fr); }
        }

        /* Estilos de las Cartas */
        .card {
            aspect-ratio: 1;
            width: 100%;
            min-width: 70px;
            max-width: 120px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.05);
        }

        .card-front {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-color: rgba(96, 165, 250, 0.2);
        }

        .card-front::after {
            content: '?';
            font-size: 2rem;
            font-weight: bold;
            color: rgba(96, 165, 250, 0.4);
        }

        .card-front:hover {
            border-color: var(--card-border);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .card-back {
            background: linear-gradient(145deg, #1e1b4b, #311b92);
            transform: rotateY(180deg);
            border-color: rgba(168, 85, 247, 0.4);
        }

        .card-icon {
            width: 50%;
            height: 50%;
            fill: #f1f5f9;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
        }

        .card.matched .card-back {
            background: linear-gradient(145deg, #064e3b, #022c22);
            border-color: var(--success-color);
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.08); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        /* Modal de Victoria */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            transition: transform 0.4s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 2rem;
            color: #60a5fa;
            margin-bottom: 15px;
        }

        .modal-text {
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <header>
        <h1>PAREJAS ESPACIALES</h1>
        <a class="back-link" href="index.html">← Volver al inicio</a>
    </header>

    <div class="controls-panel">
        <div class="stat-box">
            <span class="stat-label">Movimientos</span>
            <span class="stat-value" id="moves">0</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Tiempo</span>
            <span class="stat-value" id="timer">00:00</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Mejor Récord</span>
            <span class="stat-value" id="best-score">-</span>
        </div>
        <select class="difficulty-select" id="difficulty">
            <option value="easy">Fácil (8 Cartas)</option>
            <option value="medium" selected>Normal (16 Cartas)</option>
            <option value="hard">Difícil (24 Cartas)</option>
        </select>
        <button class="btn-reset" id="btn-restart">Reiniciar</button>
    </div>

    <div class="game-board grid-medium" id="board"></div>

    <!-- Modal de Victoria -->
    <div class="modal-overlay" id="victory-modal">
        <div class="modal-content">
            <h2 class="modal-title">¡Excelente Trabajo! 🎉</h2>
            <p class="modal-text" id="modal-summary">Completaste el juego con éxito.</p>
            <button class="btn-reset" onclick="initGame()">Jugar de Nuevo</button>
            <button class="btn-reset" style="margin-left:8px;background:rgba(59,130,246,.15);box-shadow:none" onclick="location.href='index.html'">Volver al inicio</button>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="backend.js"></script>
    <script src="scores.js"></script>
<script src="menu.js"></script>
    <script>
        WildCardScores.requireUser();   // si no hay usuario, vuelve al inicio

        // Íconos SVG vectoriales
        const SVG_ICONS = [
            `<svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2L1 21h22L12 2zm0 3.83L19.17 19H4.83L12 5.83z"/></svg>`,
            `<svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/></svg>`,
            `<svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>`,
            `<svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`,
            `<svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
            `<svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>`,
            `<svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 21l3.39-.62C9.28 20.74 10.6 21 12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>`,
            `<svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>`,
            `<svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>`,
            `<svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.92 8z"/></svg>`,
            `<svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21 16.5C21 16.88 20.79 17.21 20.47 17.38L12.57 21.82C12.4 21.92 12.2 21.97 12 21.97C11.8 21.97 11.6 21.92 11.43 21.82L3.53 17.38C3.21 17.21 3 16.88 3 16.5V7.5C3 7.12 3.21 6.79 3.53 6.62L11.43 2.18C11.6 2.08 11.8 2.03 12 2.03C12.2 2.03 12.4 2.08 12.57 2.18L20.47 6.62C20.79 6.79 21 7.12 21 7.5V16.5Z"/></svg>`,
            `<svg class="card-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>`
        ];

        // Variables de estado
        let board = document.getElementById('board');
        let movesElement = document.getElementById('moves');
        let timerElement = document.getElementById('timer');
        let bestScoreElement = document.getElementById('best-score');
        let difficultySelect = document.getElementById('difficulty');
        let btnRestart = document.getElementById('btn-restart');
        let modal = document.getElementById('victory-modal');

        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        let moves = 0;
        let matches = 0;
        let totalPairs = 0;
        let timer = null;
        let seconds = 0;
        let gameStarted = false;

        const CONFIG = {
            easy: { pairs: 4, gridClass: 'grid-easy' },
            medium: { pairs: 8, gridClass: 'grid-medium' },
            hard: { pairs: 12, gridClass: 'grid-hard' }
        };

        // Eventos
        difficultySelect.addEventListener('change', initGame);
        btnRestart.addEventListener('click', initGame);

        function loadBestScore() {
            let currentDiff = difficultySelect.value;
            let best = localStorage.getItem(`memory_best_${currentDiff}`);
            bestScoreElement.textContent = best ? `${best} movs` : '-';
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            seconds = 0;
            timer = setInterval(() => {
                seconds++;
                let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                let secs = (seconds % 60).toString().padStart(2, '0');
                timerElement.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timer);
            gameStarted = false;
        }

        function initGame() {
            stopTimer();
            timerElement.textContent = '00:00';
            modal.classList.remove('active');
            
            let diff = difficultySelect.value;
            totalPairs = CONFIG[diff].pairs;
            moves = 0;
            matches = 0;
            firstCard = null;
            secondCard = null;
            lockBoard = false;

            movesElement.textContent = moves;
            loadBestScore();

            // Configurar Grid CSS
            board.className = `game-board ${CONFIG[diff].gridClass}`;
            board.innerHTML = '';

            // Preparar e Invertir baraja
            let selectedIcons = SVG_ICONS.slice(0, totalPairs);
            let deck = [...selectedIcons, ...selectedIcons].sort(() => Math.random() - 0.5);

            // Generar Cartas
            deck.forEach((iconSvg, index) => {
                let card = document.createElement('div');
                card.classList.add('card');
                card.dataset.icon = iconSvg;

                card.innerHTML = `
                    <div class="card-face card-front"></div>
                    <div class="card-face card-back">${iconSvg}</div>
                `;

                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard || this === firstCard || this.classList.contains('matched')) return;

            startTimer();
            this.classList.add('flipped');

            if (!firstCard) {
                firstCard = this;
                return;
            }

            secondCard = this;
            lockBoard = true;
            moves++;
            movesElement.textContent = moves;

            checkMatch();
        }

        function checkMatch() {
            let isMatch = firstCard.dataset.icon === secondCard.dataset.icon;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');

            matches++;
            resetBoardVars();

            if (matches === totalPairs) {
                handleWin();
            }
        }

        function unflipCards() {
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoardVars();
            }, 1000);
        }

        function resetBoardVars() {
            [firstCard, secondCard] = [null, null];
            lockBoard = false;
        }

        function handleWin() {
            stopTimer();
            let currentDiff = difficultySelect.value;
            let bestKey = `memory_best_${currentDiff}`;
            let currentBest = localStorage.getItem(bestKey);

            if (!currentBest || moves < parseInt(currentBest)) {
                localStorage.setItem(bestKey, moves);
                loadBestScore();
            }

            // Puntos: base por parejas + bonus por pocos movimientos + bonus por rapidez
            const pairs = totalPairs;
            const pts = pairs * 50
                      + Math.max(0, pairs * 3 - moves) * 10
                      + Math.max(0, pairs * 10 - seconds) * 2;
            const grand = WildCardScores.addPoints("cartas", pts);

            document.getElementById('modal-summary').innerHTML =
                `Completaste la partida en <strong>${moves} movimientos</strong> y un tiempo de <strong>${timerElement.textContent}</strong>.` +
                `<br><br>Ganaste <strong>+${pts} puntos</strong>` +
                (grand ? `. Tu total: <strong>${grand.toLocaleString('en-US')}</strong>.` : '.');
            
            setTimeout(() => {
                modal.classList.add('active');
            }, 500);
        }

        // Iniciar al cargar la página
        initGame();
    </script>
</body>
</html>
